[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-training-data"
version = "0.1.0"
description = "Auditable CS2 demo action normalization and measured replay-frame alignment"
requires-python = ">=3.10"
dependencies = ["pyarrow==21.0.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
cs2-data = "cs2_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
